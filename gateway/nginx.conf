server {
    listen 80;

    # загрузка изображений
    client_max_body_size 20m;

    # --- внутренний подзапрос для проверки токена ---
    location = /_auth {
        internal;
        proxy_pass http://security:3000/v1/token/validation;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        # заголовок Authorization передаётся в security без изменений
    }

    # --- анонимный доступ ---

    # регистрация пользователя
    location = /v1/register {
        limit_except POST { deny all; }
        proxy_pass http://security:3000/v1/user;
    }

    # получение токена
    location = /v1/token {
        limit_except POST { deny all; }
        proxy_pass http://security:3000/v1/token;
    }
    location = /token {
        limit_except POST { deny all; }
        proxy_pass http://security:3000/v1/token;
    }

    # получение файла (как в примере curl из задания)
    location /images/ {
        limit_except GET { deny all; }
        proxy_pass http://storage:9000/images/;
    }

    # --- доступ только с проверкой токена ---

    # информация о пользователе
    location = /v1/user {
        limit_except GET { deny all; }
        auth_request /_auth;
        proxy_pass http://security:3000/v1/user;
    }

    # загрузка файла
    location = /v1/upload {
        limit_except POST { deny all; }
        auth_request /_auth;
        proxy_pass http://uploader:3000/v1/upload;
    }
    location = /upload {
        limit_except POST { deny all; }
        auth_request /_auth;
        proxy_pass http://uploader:3000/v1/upload;
    }

    # получение файла с проверкой токена
    location /v1/user/ {
        limit_except GET { deny all; }
        auth_request /_auth;
        proxy_pass http://storage:9000/images/;
    }
}
