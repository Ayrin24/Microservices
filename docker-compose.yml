services:
  storage:
    # официальные образы minio/minio и minio/mc удалены из Docker Hub и Quay (сентябрь 2026),
    # поэтому используется community-форк MinIO pgsty/silo (S3-совместим, те же переменные окружения)
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-storage_secret}
    volumes:
      - minio-data:/data
    networks:
      - internal

  # создаёт бакет images и разрешает анонимное чтение (скачивание) из него
  createbuckets:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-storage_secret}
      BUCKET_NAME: images
    entrypoint: >
      /bin/sh -c "
      until mcli alias set local http://storage:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mcli mb --ignore-existing local/images;
      mcli anonymous set download local/images;
      "
    networks:
      - internal

  security:
    build: ./security
    environment:
      PORT: 3000
    networks:
      - internal

  uploader:
    build: ./uploader
    depends_on:
      - storage
      - createbuckets
    environment:
      PORT: 3000
      S3_HOST: storage
      S3_PORT: 9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-storage}
      S3_ACCESS_SECRET: ${MINIO_ROOT_PASSWORD:-storage_secret}
      S3_BUCKET: images
    networks:
      - internal

  gateway:
    image: nginx:stable-alpine
    depends_on:
      - security
      - uploader
      - storage
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal

networks:
  internal:

volumes:
  minio-data:
